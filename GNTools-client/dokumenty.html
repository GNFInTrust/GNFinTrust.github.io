<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы на отгрузку — GN Tools</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
<style>
  :root{
    --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED;
    --border:#E6E5E3; --accent:#2783DE; --accent-soft:#E5F2FC; --green:#46A171; --green-soft:#E8F1EC;
    --red:#E56458; --red-soft:#FCE9E7; --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text); background:var(--soft); display:flex; flex-direction:column}
  button{font:inherit; cursor:pointer; color:inherit}

  header{display:flex; align-items:center; gap:16px; padding:12px 24px; background:var(--canvas); border-bottom:1px solid var(--border); flex-wrap:wrap}
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px}
  .logo-mark{width:32px; height:32px; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700}
  .logo small{display:block; font-size:12px; font-weight:400; color:var(--text2)}
  .hint-top{margin-left:auto; font-size:13px; color:var(--text2)}

  .tabs{display:flex; gap:4px; padding:12px 24px 0; max-width:1400px; margin:0 auto; width:100%; overflow-x:auto}
  .tab{padding:10px 18px; min-height:44px; border:1px solid var(--border); border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; background:var(--soft2); font-size:14px; white-space:nowrap}
  .tab.active{background:var(--canvas); font-weight:600; color:var(--accent)}

  main{flex:1; min-height:0; max-width:1400px; margin:0 auto; width:100%; padding:0 24px 24px; display:flex; flex-direction:column}
  .panel{flex:1; min-height:0; background:var(--canvas); border:1px solid var(--border); border-radius:0 var(--radius) var(--radius) var(--radius); display:none; flex-direction:column; overflow:hidden}
  .panel.active{display:flex}

  /* -------- Данные -------- */
  .data-scroll{overflow-y:auto; padding:24px}
  .groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
  fieldset{border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0}
  legend{font-size:13px; font-weight:600; color:var(--text2); padding:0 6px; text-transform:uppercase; letter-spacing:.04em}
  .f{display:flex; flex-direction:column; gap:4px}
  .f label{font-size:12px; color:var(--text2)}
  .f input{border:1px solid var(--border); border-radius:6px; padding:8px 10px; font:14px/1.4 inherit; min-height:38px; color:var(--text); width:100%}
  .f input:focus{outline:2px solid var(--accent); outline-offset:-1px}

  h3.items-title{margin:28px 0 10px; font-size:15px}
  .items-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius)}
  table.items{border-collapse:collapse; width:100%; min-width:900px; font-size:13px}
  table.items th{background:var(--soft); font-weight:600; text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap}
  table.items td{border-bottom:1px solid var(--border); padding:4px}
  table.items input{border:1px solid transparent; border-radius:4px; padding:6px 8px; font:13px/1.4 inherit; width:100%; min-width:60px; background:transparent}
  table.items input:hover{border-color:var(--border)}
  table.items input:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--canvas)}
  table.items td.num{color:var(--text2); text-align:center; width:34px}
  table.items td.calc{color:var(--text2); text-align:right; padding-right:10px; white-space:nowrap}
  table.items .del{border:none; background:transparent; color:var(--text2); font-size:14px; padding:6px 8px; border-radius:4px}
  table.items .del:hover{background:var(--red-soft); color:var(--red)}
  tfoot td{font-weight:600; background:var(--soft); padding:8px 10px !important}
  .add-row{margin-top:10px; padding:10px 16px; min-height:44px; border:1px dashed var(--border); border-radius:var(--radius); background:transparent; color:var(--text2); font-size:14px}
  .add-row:hover{color:var(--accent); border-color:var(--accent)}
  .saved-note{margin-top:16px; font-size:13px; color:var(--text2)}

  /* -------- Документы -------- */
  .doc-toolbar{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--canvas); flex-wrap:wrap}
  .doc-toolbar .name{font-weight:600; font-size:14px}
  .doc-toolbar .spacer{flex:1}
  .print-btn{display:flex; align-items:center; gap:8px; background:var(--accent); color:#fff; border:none; padding:10px 20px; min-height:44px; border-radius:var(--radius); font-weight:600; font-size:14px}
  .print-btn:hover{background:#1F6FC0}
  .zoom{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text2)}
  .zoom button{min-width:36px; min-height:36px; border:1px solid var(--border); border-radius:6px; background:var(--canvas)}
  iframe.doc{flex:1; width:100%; border:none; background:#fff}

  @media (max-width:900px){
    header{padding:12px 16px}
    .tabs,main{padding-left:16px; padding-right:16px}
    .hint-top{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">Д</div>
    <div>Документы на отгрузку<small>упак. лист · ТТН · ТН · CMR</small></div>
  </div>
  <span class="hint-top">Заполните таблицу — все 4 документа заполнятся сами</span>
</header>

<div class="tabs" id="tabs"></div>
<main id="panels"></main>

<script id="panel-data-tpl" type="text/template">
<div class="data-scroll">
  <div class="groups" id="groups"></div>
  <h3 class="items-title">Товары</h3>
  <div class="items-wrap">
    <table class="items">
      <thead><tr>
        <th>№</th><th>Наименование</th><th>Код ТН ВЭД</th><th>Ед. изм.</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th>Нетто, кг</th><th>Брутто, кг</th><th>Мест</th><th></th>
      </tr></thead>
      <tbody id="itemsBody"></tbody>
      <tfoot><tr id="totalsRow"></tr></tfoot>
    </table>
  </div>
  <button class="add-row" id="addRow">+ Добавить товар</button>
  <p class="saved-note">Всё сохраняется автоматически в этом браузере. Откройте вкладку документа и нажмите «Печать» — в диалоге печати можно сохранить в PDF и подогнать масштаб.</p>
</div>
</script>

  cmr:  { name:"CMR",              clone:true,  page:"portrait",  html: "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<title>CMR</title>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #000; padding: 16px; }\n  .sheet { width: 780px; margin: 0 auto; border: 2px solid #000; }\n  table { border-collapse: collapse; width: 100%; table-layout: fixed; }\n  td, th { border: 1px solid #000; vertical-align: top; padding: 2px 4px; }\n  .lbl { font-size: 7px; color: #222; line-height: 1.25; }\n  .lbl .de { color: #444; }\n  .num { font-weight: bold; font-size: 10px; padding-right: 3px; }\n  .val { font-size: 11px; font-weight: bold; padding: 2px 0 1px; min-height: 13px; word-wrap: break-word; }\n  .val-sm { font-size: 10px; font-weight: bold; }\n  .box { min-height: 44px; }\n  .noborder td { border: none; }\n  .center { text-align: center; }\n  .small { font-size: 7px; }\n  .hdr-title { font-size: 11px; font-weight: bold; line-height: 1.35; }\n  .conv { font-size: 6.5px; color: #333; line-height: 1.3; }\n  .goods th { font-size: 7px; font-weight: normal; text-align: left; vertical-align: top; height: 46px; }\n  .goods td.gval { font-size: 10px; font-weight: bold; text-align: center; height: 22px; vertical-align: middle; }\n  .tot td { font-size: 10px; font-weight: bold; text-align: center; background: #fafafa; }\n  .pay td { font-size: 7px; height: 15px; }\n  .sig { height: 74px; }\n  @media print {\n    body { padding: 0; }\n    .sheet { width: 100%; border-width: 1.5px; }\n  }\n</style>\n</head>\n<body>\n<div class=\"sheet\">\n\n  <!-- Шапка -->\n  <table>\n    <tr>\n      <td style=\"width:55%\">\n        <div class=\"lbl\"><span class=\"num\">1</span>Отправитель (наименование, адрес, страна)<br><span class=\"de\">Absender (Name, Anschrift, Land)</span></div>\n        <div class=\"val\">{{sender}}, {{senderAddr}}, {{loadCountry}}</div>\n      </td>\n /* ======== Числа ======== */
function num(v){ const n=parseFloat(String(v).replace(",",".").replace(/\s/g,"")); return isNaN(n)?0:n; }
function fmt(n){ if(!isFinite(n)) return ""; return (Math.round(n*1000)/1000).toLocaleString("ru-RU",{maximumFractionDigits:3}).replace(/\u00a0/g," "); }
const W1=["","одно","два","три","четыре","пять","шесть","семь","восемь","девять","десять","одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать"];
const W10=["","","двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"];
const W100=["","сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];
function wordsRu(n){
  n=Math.round(num(n)); if(n<=0) return "";
  if(n>=1000) return String(n);
  const parts=[];
  parts.push(W100[Math.floor(n/100)]); n%=100;
  if(n<20){ parts.push(W1[n]); } else { parts.push(W10[Math.floor(n/10)]); parts.push(W1[n%10]); }
  return parts.filter(Boolean).join(" ");
}

/* ======== Подстановка ======== */
function itemCalc(it){
  const sum=num(it.qty)*num(it.price);
  return { sum: sum? fmt(sum):"", grossT: num(it.gross)? fmt(num(it.gross)/1000):"" };
}
function totals(){
  const t={qty:0,net:0,gross:0,places:0,sum:0};
  data.items.forEach(it=>{ t.qty+=num(it.qty); t.net+=num(it.net); t.gross+=num(it.gross); t.places+=num(it.places); t.sum+=num(it.qty)*num(it.price); });
  return t;
}
function buildMap(){
  const t=totals();
  const m=Object.assign({}, data);
  delete m.items;
  m.totQty=t.qty?fmt(t.qty):""; m.totNet=t.net?fmt(t.net):""; m.totGross=t.gross?fmt(t.gross):"";
  m.totGrossT=t.gross?fmt(t.gross/1000):""; m.totPlaces=t.places?fmt(t.places):"";
  m.totPlacesWords=wordsRu(t.places); m.totSum=t.sum?fmt(t.sum):"";
  if(!m.cargoName) m.cargoName = (data.items[0]&&data.items[0].name)||"";
  return m;
}
function renderDoc(key){
  const doc=RAW_DOCS[key];
  let html=doc.html;
  const map=buildMap();
  if(doc.clone && data.items.length>1){
    const re=/<tr[^>]*>(?:(?!<\/tr>)[\s\S])*?\{\{i1\.(?:(?!<\/tr>)[\s\S])*?<\/tr>/;
    const m=html.match(re);
    if(m){
      let rows=m[0];
      for(let k=2;k<=data.items.length;k++) rows+=m[0].replaceAll("{{i1.","{{i"+k+".");
      html=html.replace(m[0], rows);
    }
  }
  data.items.forEach((it,idx)=>{
    const k=idx+1, c=itemCalc(it);
    const vals={ n:String(k), name:it.name, tnved:it.tnved, unit:it.unit, qty:it.qty, price:it.price,
      net:it.net, gross:it.gross, places:it.places, sum:c.sum, grossT:c.grossT };
    for(const f in vals) html=html.replaceAll("{{i"+k+"."+f+"}}", vals[f]==null?"":String(vals[f]));
  });
  html=html.replace(/\{\{([A-Za-z0-9_.]+)\}\}/g,(s,k)=> map[k]!=null? String(map[k]) : "");
  html=html.replace("</head>", '<style>@page{size:A4 '+doc.page+'; margin:8mm} body{margin:8px}</style></head>');
  return html;
}

function buildTabs(){
  tabsEl.innerHTML="";
  TABS.forEach(t=>{
    const b=document.createElement("button");
    b.className="tab"+(t.id===activeTab?" active":"");
    b.textContent=t.name;
    b.onclick=()=>{ activeTab=t.id; buildTabs(); showPanel(); };
    tabsEl.appendChild(b);
  });
}
function showPanel(){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.id===activeTab));
  if(activeTab!=="data" && dirty[activeTab]){
    document.querySelector('.panel[data-id="'+activeTab+'"] iframe').srcdoc=renderDoc(activeTab);
    dirty[activeTab]=false;
  }
}

    });
    const tdDel=document.createElement("td");
    const del=document.createElement("button"); del.className="del"; del.textContent="✕"; del.title="Удалить строку";
    del.onclick=()=>{ data.items.splice(idx,1); if(!data.items.length) data.items.push({name:"",tnved:"",unit:"шт",qty:"",price:"",net:"",gross:"",places:""}); save(); markDirty(); renderItems(); };
    tdDel.appendChild(del); tr.appendChild(tdDel);
    itemsBody.appendChild(tr);
  });
  renderCalc();
}
function renderCalc(){
  Array.from(itemsBody.rows).forEach((tr,idx)=>{
    tr.querySelector('[data-calc="sum"]').textContent=itemCalc(data.items[idx]).sum;
  });
  const t=totals();
  totalsRow.innerHTML="";
  const cells=["","Итого","","", t.qty?fmt(t.qty):"", "", t.sum?fmt(t.sum):"", t.net?fmt(t.net):"", t.gross?fmt(t.gross):"", t.places?fmt(t.places):"", ""];
  cells.forEach(c=>{ const td=document.createElement("td"); td.textContent=c; totalsRow.appendChild(td); });
}
document.getElementById("addRow").onclick=()=>{
  data.items.push({name:"",tnved:"",unit:"шт",qty:"",price:"",net:"",gross:"",places:""});
  save(); markDirty(); renderItems();
};

buildTabs(); renderItems(); showPanel();
</script>

<!-- ======== ДОСТУП: Firebase — аккаунты, подписка, токены ======== -->
<style>
  .auth-overlay{position:fixed; inset:0; background:var(--soft); display:flex; align-items:center; justify-content:center; z-index:50}
  .auth-overlay.modal{background:rgba(0,0,0,.35)}
  .auth-card{width:380px; max-width:92vw; background:var(--canvas); border:1px solid var(--border); border-radius:12px; padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.10)}
  .auth-card h2{font-size:18px; margin-bottom:4px}
  .auth-card p.sub{font-size:13px; color:var(--text2); margin-bottom:16px}
  .auth-card input{width:100%; border:1px solid var(--border); border-radius:6px; padding:10px 12px; font:14px/1.4 inherit; margin-bottom:10px; min-height:42px}
  .auth-card input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .auth-card .btn{width:100%; background:var(--accent); border:none; color:#fff; border-radius:8px; padding:11px; font-weight:600; font-size:14px; min-height:44px}
  .auth-card .btn:hover{background:#1F6FC0}
  .auth-card .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--border); margin-top:8px}
  .auth-err{color:var(--red); font-size:13px; margin-bottom:8px; min-height:16px}
  .acc-badge{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text2); margin-left:auto}
  .acc-badge .pill{background:var(--green-soft); color:var(--green); border-radius:99px; padding:3px 10px; font-weight:600; font-size:12px; white-space:nowrap}
  .acc-badge .pill.warn{background:var(--red-soft); color:var(--red)}
  .acc-badge button{border:1px solid var(--border); background:var(--canvas); border-radius:6px; padding:6px 12px; font-size:13px; min-height:36px}
  .paylist{font-size:13px; color:var(--text2); margin:10px 0 16px; line-height:1.6}
  .paylist b{color:var(--text)}
</style>
<script>
/* ↓↓↓ ВСТАВЬТЕ КЛЮЧИ СВОЕГО ПРОЕКТА FIREBASE (см. FIREBASE-SETUP.txt) ↓↓↓ */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};
/* Ссылка на оплату подписки/токенов (необязательно) */
const PAY_URL = "";
/* Сколько токенов даётся новому аккаунту и цена одной печати */
const ACCESS = { trialTokens: 5, tokenPerPrint: 1 };
</script>
<script>
(function(){
"use strict";
const FB_ON = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey);
if(!FB_ON){
  const n=document.createElement("span");
  n.className="hint-top"; n.style.color="var(--red)";
  n.textContent="⚠ Firebase не настроен — локальный режим без аккаунтов (см. FIREBASE-SETUP.txt)";
  document.querySelector("header").appendChild(n);
  return;
}
let auth=null, db=null, user=null, profile=null, unsubProfile=null;

/* ---- UI ---- */
const overlay=document.createElement("div");
overlay.className="auth-overlay";
overlay.innerHTML =
  '<div class="auth-card">'+
  '  <h2>Вход в аккаунт</h2>'+
  '  <p class="sub">Доступ к документам — по подписке или токенам. Новый аккаунт получает '+ACCESS.trialTokens+' пробных токенов.</p>'+
  '  <div class="auth-err" id="authErr"></div>'+
  '  <input id="authEmail" type="email" placeholder="E-mail" autocomplete="username">'+
  '  <input id="authPass" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password">'+
  '  <button class="btn" id="authIn">Войти</button>'+
  '  <button class="btn ghost" id="authUp">Создать аккаунт</button>'+
  '</div>';
document.body.appendChild(overlay);

const badge=document.createElement("div");
badge.className="acc-badge"; badge.style.display="none";
document.querySelector("header").appendChild(badge);
const topHint=document.querySelector(".hint-top");

const paywall=document.createElement("div");
paywall.className="auth-overlay modal"; paywall.style.display="none";
paywall.innerHTML =
  '<div class="auth-card">'+
  '  <h2>Нужен доступ</h2>'+
  '  <div class="paylist" id="payInfo"></div>'+
  (PAY_URL ? '  <a class="btn" style="display:block;text-align:center;text-decoration:none" href="'+PAY_URL+'" target="_blank" rel="noopener">Оплатить</a>' : '')+
  '  <button class="btn ghost" id="payClose">Закрыть</button>'+
  '</div>';
document.body.appendChild(paywall);
paywall.querySelector("#payClose").onclick=()=>paywall.style.display="none";

function err(msg){ overlay.querySelector("#authErr").textContent=msg||""; }
function ruErr(e){
  const c=(e&&e.code)||"";
  if(c.includes("invalid-email")) return "Некорректный e-mail";
  if(c.includes("weak-password")) return "Пароль слишком короткий (мин. 6 символов)";
  if(c.includes("email-already-in-use")) return "Такой аккаунт уже есть — нажмите «Войти»";
  if(c.includes("user-not-found")||c.includes("wrong-password")||c.includes("invalid-credential")) return "Неверный e-mail или пароль";
  if(c.includes("network")) return "Нет связи с сервером — проверьте интернет";
  return "Ошибка: "+((e&&e.message)||e);
}

/* ---- доступ ---- */
function parseDate(s){ if(!s) return null; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m? new Date(+m[1],+m[2]-1,+m[3],23,59,59) : null; }
function hasSub(p){ const d=parseDate(p&&p.subUntil); return !!(d && d>=new Date()); }
function tokensOf(p){ const t=p&&p.tokens; return typeof t==="number"&&isFinite(t)? Math.max(0,Math.floor(t)) : 0; }
function hasAccess(){ return !!profile && (hasSub(profile) || tokensOf(profile)>0); }

function renderBadge(){
  if(!user){ badge.style.display="none"; if(topHint) topHint.style.display=""; return; }
  if(topHint) topHint.style.display="none";
  badge.style.display="flex";
  let pill;
  if(!profile) pill='<span class="pill warn">загрузка…</span>';
  else if(hasSub(profile)) pill='<span class="pill">Подписка до '+profile.subUntil.split("-").reverse().join(".")+'</span>';
  else if(tokensOf(profile)>0) pill='<span class="pill">Токены: '+tokensOf(profile)+'</span>';
  else pill='<span class="pill warn">Нет доступа</span>';
  badge.innerHTML='<b>'+(user.email||"")+'</b> '+pill+' <button id="accOut">Выйти</button>';
  badge.querySelector("#accOut").onclick=()=>auth.signOut();
}
function showPaywall(){
  const info=paywall.querySelector("#payInfo");
  info.innerHTML=
    'Статус: <b>'+(hasSub(profile)?"подписка активна":"подписки нет")+'</b><br>'+
    'Токены: <b>'+tokensOf(profile)+'</b> (1 печать = '+ACCESS.tokenPerPrint+' токен)<br><br>'+
    'Подписка даёт безлимитную печать до указанной даты.'+
    (PAY_URL? '' : '<br>Для пополнения обратитесь к администратору.');
  paywall.style.display="flex";
}

/* ---- гейты: вкладки документов и печать ---- */
document.getElementById("tabs").addEventListener("click",function(e){
  const b=e.target.closest(".tab");
  if(!b || b.textContent.indexOf("Данные")!==-1) return;
  if(!hasAccess()){ e.stopPropagation(); e.preventDefault(); showPaywall(); }
},true);

document.addEventListener("click",function(e){
  const btn=e.target.closest(".print-btn");
  if(!btn) return;
  if(profile && hasSub(profile)) return; /* подписка — безлимит */
  e.stopImmediatePropagation(); e.preventDefault();
  if(!profile || tokensOf(profile)<ACCESS.tokenPerPrint){ showPaywall(); return; }
  const ref=db.collection("users").doc(user.uid);
  db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      const t=tokensOf(snap.data()||{});
      if(t<ACCESS.tokenPerPrint) throw new Error("NO_TOKENS");
      tx.update(ref,{tokens:t-ACCESS.tokenPerPrint});
    });
  }).then(function(){
    const fr=btn.closest(".panel").querySelector("iframe");
    fr.contentWindow.focus(); fr.contentWindow.print();
  }).catch(function(){ showPaywall(); });
},true);

/* ---- загрузка SDK и инициализация ---- */
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
var CDN="https://www.gstatic.com/firebasejs/10.14.1/";
loadScript(CDN+"firebase-app-compat.js")
.then(function(){ return Promise.all([loadScript(CDN+"firebase-auth-compat.js"), loadScript(CDN+"firebase-firestore-compat.js")]); })
.then(function(){
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();

  overlay.querySelector("#authIn").onclick=function(){
    err("");
    auth.signInWithEmailAndPassword(overlay.querySelector("#authEmail").value.trim(), overlay.querySelector("#authPass").value)
      .catch(function(e){ err(ruErr(e)); });
  };
  overlay.querySelector("#authUp").onclick=function(){
    err("");
    var em=overlay.querySelector("#authEmail").value.trim(), pw=overlay.querySelector("#authPass").value;
    auth.createUserWithEmailAndPassword(em,pw).then(function(cred){
      return db.collection("users").doc(cred.user.uid).set({
        email:em, tokens:ACCESS.trialTokens, subUntil:"", created:firebase.firestore.FieldValue.serverTimestamp()
      });
    }).catch(function(e){ err(ruErr(e)); });
  };

  auth.onAuthStateChanged(function(u){
    user=u; profile=null;
    if(unsubProfile){ unsubProfile(); unsubProfile=null; }
    if(!u){ overlay.style.display="flex"; renderBadge(); return; }
    overlay.style.display="none"; err("");
    unsubProfile=db.collection("users").doc(u.uid).onSnapshot(function(snap){
      if(!snap.exists){
        db.collection("users").doc(u.uid).set({email:u.email||"", tokens:ACCESS.trialTokens, subUntil:"", created:firebase.firestore.FieldValue.serverTimestamp()});
        return;
      }
      profile=snap.data(); renderBadge();
    }, function(){ profile={tokens:0,subUntil:""}; renderBadge(); });
    renderBadge();
  });
})
.catch(function(){
  overlay.querySelector(".auth-card").innerHTML=
    '<h2>Нет связи</h2><p class="sub">Не удалось загрузить Firebase. Проверьте интернет-соединение и обновите страницу.</p>'+
    '<button class="btn" onclick="location.reload()">Обновить</button>';
});
})();
</script>
</body>
</html>
