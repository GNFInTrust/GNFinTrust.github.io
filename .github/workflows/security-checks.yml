name: Security and reliability checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py
      - run: python -m unittest discover -s tests -v
      - run: npm test --prefix GNTools-client
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund --allow-remote=root --prefix GNTools-client
      - run: npm test --prefix GNTools-client
      - run: npx --yes firebase-tools emulators:exec --only firestore,auth --project demo-gnfintrust 'python -m unittest discover -s tests -p test_firestore_rules.py -v'
